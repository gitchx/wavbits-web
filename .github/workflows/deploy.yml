name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - index.html
      - src/input.css
      - style.css
      - package.json
      - package-lock.json
      - deploy-vps.sh
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wavbits-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload and deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          REMOTE_DIR: /tmp/wavbits-web-${{ github.sha }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "install -d -m 700 '$REMOTE_DIR'"
          scp index.html style.css deploy-vps.sh "$VPS_USER@$VPS_HOST:$REMOTE_DIR/"
          ssh "$VPS_USER@$VPS_HOST" "sudo bash '$REMOTE_DIR/deploy-vps.sh'; rm -rf '$REMOTE_DIR'"
